[project]
name = "dagster-webhook"
version = "1.0.0"
description = "A FastAPI-based RPC/Webhook gateway for Dagster GraphQL API with authentication and monitoring endpoints"
requires-python = ">=3.13"
dependencies = [
    "dagster==1.13.0",
    "dagster-graphql",
    "fastapi",
    "pydantic",
    "uvicorn",
]
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'"
]