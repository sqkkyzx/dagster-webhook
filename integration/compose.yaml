services:
  dagster:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    volumes:
      - dagster-storage:/opt/dagster/home/storage
    networks: [acceptance]
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    command: ["python", "upstream_proxy.py", "--host", "0.0.0.0", "--port", "3001", "--upstream", "http://dagster:3000"]
    networks: [acceptance]
  gateway:
    image: ${DAGSTER_ACCEPTANCE_IMAGE:?required}
    environment:
      APP_API_TOKEN: ${DAGSTER_ACCEPTANCE_TOKEN:?required}
      DAGSTER_URL: http://proxy:3001
      DAGSTER_TIMEOUT: "20"
      DAGSTER_READINESS_TIMEOUT: "1"
      IDEMPOTENCY_DB_PATH: /data/idempotency.sqlite3
      IDEMPOTENCY_LEASE_SECONDS: "2"
      RUN_OUTPUT_STORAGE_ROOT: /opt/dagster/home/storage
    volumes:
      - gateway-data:/data
      - dagster-storage:/opt/dagster/home/storage:ro
    networks: [acceptance]
volumes:
  gateway-data:
  dagster-storage:
networks:
  acceptance:
    internal: true
